name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      ANDROID_API_LEVEL: "36"
      ANDROID_BUILD_TOOLS: "36.0.0"
      ANDROID_NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Prepare isolated Android SDK
        run: |
          set -euo pipefail
          sdk_root="$RUNNER_TEMP/syncpeer-android-sdk"
          mkdir -p "$sdk_root"
          (set +o pipefail; yes | sdkmanager --sdk_root="$sdk_root" --licenses >/dev/null)
          sdkmanager --sdk_root="$sdk_root" "platform-tools" "platforms;android-${ANDROID_API_LEVEL}" "build-tools;${ANDROID_BUILD_TOOLS}" "ndk;${ANDROID_NDK_VERSION}"
          {
            echo "ANDROID_HOME=$sdk_root"
            echo "ANDROID_SDK_ROOT=$sdk_root"
            echo "ANDROID_NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=$sdk_root/ndk/${ANDROID_NDK_VERSION}"
            echo "NDK_HOME=$sdk_root/ndk/${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Verify pinned Android NDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_HOME" = "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          test "$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: npm run build:android:init

      - name: Generate Tauri icons
        run: npm run icons:generate

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing required secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build Android release APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android:prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: syncpeer-android-release-apk
          path: |
            syncpeer-android-release-arm64-v8a.apk
            dist/syncpeer-android-release-arm64-v8a.apk
            packages/tauri-shell/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
