name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "27.0.12077973"

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches application version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(jq -er '.version' packages/tauri-shell/src-tauri/tauri.conf.json)"
          if [[ -z "$tag_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Tauri version $app_version." >&2
            echo "Create a tag such as v$app_version." >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  appimage:
    name: Build AppImage
    needs: validate-tag
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build AppImage
        run: npm run build:tauri:bundle:appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  flatpak:
    name: Build Flatpak
    needs: validate-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            appstream \
            elfutils \
            flatpak \
            flatpak-builder

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Flatpak
        run: npm run build:tauri:bundle:flatpak

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build signed Android APK
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Install npm dependencies
        run: npm ci

      - name: Initialize Tauri Android project
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
        run: npm run build:android:init

      - name: Generate Tauri icons
        run: npm run icons:generate

      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing required secret: ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed Android APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.ANDROID_NDK_VERSION }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run build:android:prod

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/syncpeer-android-release-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate-tag, appimage, flatpak, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find release-assets -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          flatpak="$(find release-assets -maxdepth 1 -type f -name '*.flatpak' -print -quit)"
          apk="$(find release-assets -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -s "$appimage"
          test -s "$flatpak"
          test -s "$apk"
          (
            cd release-assets
            sha256sum \
              "$(basename "$appimage")" \
              "$(basename "$flatpak")" \
              "$(basename "$apk")" \
              > SHA256SUMS
          )

      - name: Publish release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-github-release.sh release-assets "$GITHUB_REF_NAME"
