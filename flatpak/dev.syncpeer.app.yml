id: dev.syncpeer.app
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: tauri-shell

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node20
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: syncpeer
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        HOME: /run/build/syncpeer
        CARGO_HOME: /run/build/syncpeer/cargo
        npm_config_cache: /run/build/syncpeer/npm-cache
      append-path: /usr/lib/sdk/node20/bin:/usr/lib/sdk/rust-stable/bin
    build-commands:
      - npm ci
      - npm run icons:generate
      - npm run build -w @syncpeer/tauri-shell
      - install -Dm755 packages/tauri-shell/src-tauri/target/release/tauri-shell /app/bin/tauri-shell
      - install -Dm644 flatpak/dev.syncpeer.app.desktop /app/share/applications/dev.syncpeer.app.desktop
      - install -Dm644 flatpak/dev.syncpeer.app.metainfo.xml /app/share/metainfo/dev.syncpeer.app.metainfo.xml
      - install -Dm644 packages/tauri-shell/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/dev.syncpeer.app.png
      - install -Dm644 packages/tauri-shell/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/dev.syncpeer.app.png
      - install -Dm644 packages/tauri-shell/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/dev.syncpeer.app.png
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .direnv
          - .flatpak-builder
          - .tmp
          - .tools
          - dist
          - node_modules
          - packages/app/dist
          - packages/tauri-shell/src-tauri/gen
          - packages/tauri-shell/src-tauri/target
