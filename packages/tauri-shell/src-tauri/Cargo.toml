[package]
name = "tauri-shell"
version = "0.5.0"
edition = "2021"

[lib]
name = "tauri_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
lan-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
cap-std = "4"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tauri-plugin-syncpeer-android = { path = "plugins/syncpeer-android" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.12"
sha2 = "0.10"
data-encoding = "2.6"
url = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
x509-parser = "0.16"
prost = "0.13"
quinn = "0.11"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
tempfile = "3"
